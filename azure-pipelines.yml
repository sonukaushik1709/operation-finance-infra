resources:
  repositories:
    - repository: amazonSalesRepo     
      type: git
      name: sonupandit/amazon sales project/infra-planing
      ref: main                        

trigger: none
pool: window-agent

parameters:
  - name: environment
    default: dev
    values:
      - dev
      - qa
      - prod

stages:
  - stage: terraform_install_init
    jobs:
      - template: template/terraform-init.yml@amazonSalesRepo
        parameters:
          environment: ${{ parameters.environment }}



